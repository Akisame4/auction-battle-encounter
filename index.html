  return again + `<div class="reveal">${side(me())}${lotCard(c.item, `LOT ${String(c.n).padStart(2, '0')}`)}${side(op())}</div>${verdict}`;
}
function viewDice() {
  const V = S.V;
  const rolling = PB.rolls;
  // ダイスのカード。roll はこの番の出目(借りたダイスは、振っている人の出目を持ち主の欄に出す)
  const card = (r, id, label, snap) => {
    const roll = rolling ? rolling.list.find(x => x.id === id) : null;
    const cur = roll && rolling.list[rolling.i]?.id === id;
    const tags = [];
    if (snap?.broken?.includes(id)) tags.push('壊れた');
    if (snap?.stance?.includes(id)) tags.push('🎯構え');
    const out = snap?.out?.find(o => o.id === id);
    if (out) tags.push(out.why === '麻痺' ? '⚡麻痺中' : '押し出し中');
    if (snap?.lent?.includes(id)) tags.push('🧲奪われ中');
    if (snap?.shift?.includes(id)) tags.push('↓出目ずらし');
    const dim = snap?.broken?.includes(id) || out || snap?.lent?.includes(id);
    const faces = [1, 2, 3, 4, 5, 6].map(f => `<div class="mf ${roll?.face === f ? 'hit' : ''}"><span class="fnum">${f}</span>${dieKnown(id) ? esc(faceShort(id, f)) : '？'}</div>`).join('');
    return `<div class="dcard ${cur ? 'cur' : ''} ${dim ? 'broken' : ''} ${isDecoy(id) ? 'decoy' : ''}" title="${esc(dieKnown(id) ? dieSummary(id) + (DIE[id].passive ? ' / ' + DIE[id].passive : '') : '')}">
      <div class="dh"><img src="${DIE[id].img}" alt=""><div><b>${label}</b><small>${esc(DIE[id].job)}${tags.map(t => ' ・ ' + t).join('')}</small></div></div>
      <div class="mfs">${faces}</div></div>`;
  };
  const col = r => {
    const snap = PB.snap?.[r];
    const cards = V.owned[r].map((id, k) => card(r, id, `${k + 1}. ${esc(DIE[id].name)}`, snap))
      .concat((snap?.decoys || []).map(id => card(r, id, esc(DIE[id].name), snap))).join('');
    const borrowed = (snap?.borrow || []).map(id => DIE[id].name);
    return `<div class="die ${cls(r)}"><h4>${who(r)}のダイス ・ ${V.owned[r].length}個${snap?.decoys?.length ? ` + デコイ${snap.decoys.length}個` : ''}</h4>
      ${borrowed.length ? `<div class="muted" style="font-size:12px;margin:-4px 0 6px">🧲 借りている: ${borrowed.map(esc).join('、')}(次の番に振る)</div>` : ''}
      <div class="dcards">${cards || '<p class="muted" style="font-size:12px">まだありません</p>'}</div></div>`;
  };
  return `<div class="dicep">${col(me())}${col(op())}</div>`;
}
function viewBattle() {
  const V = S.V, B = V.battle;
  const shownAll = PB.shown >= B.turns.length && !PB.busy;
  let top;
  if (V.phase === 'result' && shownAll) {
    const w = B.result.winner;
    const t = w == null ? ['DRAW', '引き分け', 'draw'] : w === me() ? ['WIN', 'あなたの勝ち', 'win'] : ['LOSE', 'あなたの負け', 'lose'];
    const rm = S.pub?.rematch?.go || {};
    top = `<div class="result ${t[2]}">${t[0]}<small>${t[1]}</small></div><div class="center turnline">${fillNames(B.result.reason)}</div>
      <div class="row" style="justify-content:center;margin-top:12px">
        ${rm[me()] ? `<div class="wait" style="color:inherit">${rm[op()] ? '再戦を準備しています' : '相手の返事を待っています'}<span class="dots"></span></div>` : `<button class="btn" data-act="rematch">もう一度遊ぶ</button>`}
        ${S.role === 'host' ? modeSelect() : ''}
      </div>${rm[op()] && !rm[me()] ? '<div class="note">相手は再戦を希望しています</div>' : ''}`;
  } else {
    const nextT = PB.busy ? B.turns[PB.shown] : B.turns[V.rolled];
    const myTurn = V.phase === 'battle' && V.need.by === me() && !PB.busy && PB.shown >= V.rolled;
    const turnInfo = nextT ? `ターン <b>${nextT.round}</b> / ${TURN_LIMIT} ・ <b class="${cls(nextT.role)}">${who(nextT.role)}</b>の番` : '';
    const firstInfo = `先攻: <b class="${cls(B.first)}">${who(B.first)}</b>${B.tied ? '(チップが同じなのでランダム)' : '(チップが少ない方)'}`;
    top = `<div class="turnline">${firstInfo}</div><div class="turnline">${turnInfo}</div>
      <div class="turnline">自分の番に、持っているダイスを全部同時に振ります(あなた ${V.owned[me()].length}個 / 相手 ${V.owned[op()].length}個)</div>
      <div class="row" style="margin-top:14px;min-height:50px">
        ${myTurn ? `<button class="btn" data-act="roll" style="font-size:18px;padding:13px 30px">ダイスを振る</button>`
               : `<div class="wait" style="color:inherit">${PB.busy ? 'ダイスが転がっています' : '相手が振るのを待っています'}<span class="dots"></span></div>`}</div>
      <label class="toggle" style="margin-top:10px"><input type="checkbox" id="autoRoll" ${S.autoRoll ? 'checked' : ''}> 自分の番は自動で振る</label>`;
  }
  return `<div class="tbl-head"><span>BATTLE</span><span>${shownAll && V.phase === 'result' ? 'GAME OVER' : ''}</span></div>
    <div class="arena">${top}</div>`;
}
// 2人の状態(毒・死の宣告は重なった分を1つずつ並べる)
function statusRows(s) {
  if (!s) return [];
  const rows = [];
  const names = ids => ids.map(id => esc(DIE[id].name)).join('、');
  if (s.guard) rows.push(['🛡', `防御 <b>${s.guard}</b>`, '次に受けるダメージをこの分減らす(1回で消える)']);
  if (s.buff) rows.push(['🔥', `次の攻撃 <b>+${s.buff}</b>`, '次に相手へ与えるダメージに足される']);
  if (s.weaken) rows.push(['▼', `次の攻撃 <b>-${s.weaken}</b>`, '次に相手へ与えるダメージが減る']);
  if (s.vuln) rows.push(['◎', `被ダメージ <b>+${s.vuln}</b>`, '次に受けるダメージが増える']);
  if (s.poison) rows.push(['☠', `毒 <b>${s.poison}</b>`, '自分の番の終わりに毎回ダメージ(防御で防げない)']);
  if (s.immovable) rows.push(['⚓', '移動不可', '相手の次の番まで、ダイスは動かされない']);
  if (s.decoys?.length) rows.push(['🎲', `デコイ <b>${s.decoys.length}個</b>`, '一緒に振られる(全部の面が10ダメージ)']);
  for (const o of s.out || []) rows.push([o.why === '麻痺' ? '⚡' : '➜', `${esc(DIE[o.id].name)} ${o.why}`, '次の番は振れない']);
  if (s.lent?.length) rows.push(['🧲', `${names(s.lent)} 奪われ中`, '相手が次の番に振り、そのあと戻る']);
  if (s.borrow?.length) rows.push(['🧲', `${names(s.borrow)} を借りている`, '次の自分の番に振る']);
  if (s.shift?.length) rows.push(['↓', `${names(s.shift)} 出目ずらし`, '次に出る目が1つ下がる']);
  for (const id of s.stance || []) rows.push(['🎯', `${esc(DIE[id].name)} 狙撃の構え`, 'このダイスの攻撃が2倍']);
  for (const id of s.broken || []) rows.push(['💥', `${esc(DIE[id].name)} 壊れた`, 'もう振られない']);
  return rows;
}
const lastStatus = {};
function viewStatus(r) {
  const rows = statusRows(PB.snap?.[r]);
  const prev = lastStatus[r] || [];
  const html = rows.length ? rows.map(([ic, t, sub]) => `<div class="st ${prev.includes(t + sub) ? '' : 'new'}"><span class="ic">${ic}</span><span>${t}<small>${sub}</small></span></div>`).join('')
    : '<div class="none">なし</div>';
  lastStatus[r] = rows.map(x => x[1] + x[2]);
  return `<div class="status"><h5>状態</h5>${html}</div>`;
}
function viewLog() {
  if (!PB.log.length) return '<p class="muted">まだ誰も振っていません</p>';
  return `<div class="log">${PB.log.map(({ role, round, st }) => {
    const head = st.kind === 'poison' ? `ターン${round} ${who(role)}の番の終わり`
      : st.kind === 'none' ? `ターン${round} ${who(role)}の番`
      : `ターン${round} ${who(role)}: ${esc(DIE[st.id].name)} ${st.face}の目「${esc(faceShort(st.id, st.face))}」${st.kind === 'pre' ? '(番のはじめ)' : ''}`;
    return `<div class="le ${cls(role)}"><div class="h">${head}</div>${st.lines.map(fillNames).join('<br>')}</div>`;
  }).join('')}</div>`;
}
// キューブは描き直しのたびに作り直されるので、回転は描画後にかける
let cubeSpin = 0, lastCubeAnim = null;
// チップがトレイから卓の中央へ飛んでいく演出(画面の描き直しに巻き込まれないよう body 直下に置く)
function flyChip(fromEl, d) {
  const to = document.getElementById('pot');
  if (!fromEl || !to) return;
  const a = fromEl.getBoundingClientRect(), b = to.getBoundingClientRect();
  const el = document.createElement('span');
  el.className = `chip k${d} flychip`;
  el.innerHTML = `<span>${d}</span>`;
  el.style.left = a.left + 'px'; el.style.top = a.top + 'px';
  document.body.appendChild(el);
  el.getBoundingClientRect();
  el.style.transform = `translate(${b.left + b.width / 2 - a.left - 29}px,${b.top + b.height / 2 - a.top - 29}px) scale(.85)`;
  setTimeout(() => { el.style.opacity = '0'; }, 380);
  setTimeout(() => el.remove(), 800);
}

let toastTimer;
function toast(msg) {
  let el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 2500);
}

// ---------------- 能力一覧と数値の調整(ゲーム前にロビー・ルームから開く) ----------------
const PARAM_LABEL = { dmg: 'ダメージ', self: '自傷', heal: '回復', guard: '防御', poison: '毒', buff: '強化', weaken: '弱体', vuln: '被ダメ+', rally: '全攻撃+', healper: '1個につき回復', guardper: '1個につき防御' };
const dbgEl = document.getElementById('dbg');
let dbgOpen = false;

function dbgDesc(d) {
  const t = tunedFaces(d.id, localTune);
  return [1, 2, 3, 4, 5, 6].map(f => `${f}: ${fxText(t[f])}`).join('<br>');
}
function dbgParams(d) {
  const base = JSON.parse(BASE_F[d.id]), t = tunedFaces(d.id, localTune);
  const out = [];
  for (let face = 1; face <= 6; face++) {
    const cells = t[face].map((f, i) => {
      if (!('n' in f)) return `<span class="muted">${esc(FX_SHORT[f.op](f))}</span>`;
      const k = `${d.id}~${face}~${i}~n`, was = base[face][i].n, chg = f.n !== was;
      return `<label class="prm ${chg ? 'chg' : ''}"><span>${esc(PARAM_LABEL[f.op] || '数値')}</span><input type="number" data-k="${k}" value="${f.n}" min="0" step="1">${chg ? `<span class="was">元${was}</span>` : ''}</label>`;
    }).join('');
    out.push(`<div class="fl"><b>${face}</b>${cells}</div>`);
  }
  return out.join('');
}
function renderDbg() {
  if (!dbgOpen) { dbgEl.hidden = true; return; }
  const ingame = S.screen === 'game' && S.pub?.start;
  const rule = tunedRule(localTune);
  const ruleRow = Object.keys(RULE_BASE).map(key => {
    const chg = rule[key] !== RULE_BASE[key];
    return `<label class="prm ${chg ? 'chg' : ''}"><span>${esc(RULE_LABEL[key])}</span><input type="number" data-k="rule~${key}" value="${rule[key]}" min="1" step="1">${chg ? `<span class="was">元${RULE_BASE[key]}</span>` : ''}</label>`;
  }).join('');
  const rows = [...DICE_POOL, DECOY_DIE].map(d => `<tr data-id="${d.id}"><td class="nm"><img class="av" src="${d.img}" alt=""> ${esc(d.name)}<small>${esc(d.job)}</small></td>
      <td class="pr">${dbgParams(d)}</td><td class="ds">${dbgDesc(d)}${d.passive ? `<br><span style="color:var(--gold)">${esc(d.passive)}</span>` : ''}</td></tr>`).join('');
  const n = Object.keys(localTune).length;
  dbgEl.innerHTML = `<div class="box">
    <div class="top"><h3>能力の調整</h3><span class="tag">変更 ${n}件</span><div class="spacer" style="flex:1"></div>
      <button class="ghost" data-dbg="export">変更点を書き出す</button><button class="ghost" data-dbg="reset" ${n ? '' : 'disabled'}>全部元に戻す</button><button class="btn" data-dbg="close" style="padding:8px 18px">閉じる</button></div>
    <div class="note">数値はこのブラウザに保存されます。ゲーム開始(再戦を含む)のとき、ホストの調整値が相手にも配られて、その対戦はその値で進みます。
      ${ingame ? '<br><b style="color:var(--gold-hi)">いまの対戦には反映されません。次のゲームから反映されます。</b>' : ''}
      ${ingame && S.pub.start.tune ? `<br>いまの対戦はホストの調整値(${Object.keys(S.pub.start.tune).length}件)で進んでいます。` : ''}</div>
    <div class="rulebox">${ruleRow}</div>
    <table><tr><th>ダイス(全${DICE_POOL.length}体+デコイ)</th><th>面ごとの数値</th><th>いまの効果</th></tr>${rows}</table>
    <textarea id="dbgOut" readonly hidden></textarea></div>`;
  dbgEl.hidden = false;
}
function dbgExport() {
  const lines = [];
  for (const k in localTune) {
    const [id, face, i, key] = k.split('~');
    if (id === 'rule') { lines.push(`${RULE_LABEL[face]} ${RULE_BASE[face]} → ${tuneValue(face, localTune[k])}`); continue; }
    const d = DIE[id];
    if (!d) continue;
    const base = JSON.parse(BASE_F[id])[face][i];
    lines.push(`${d.name}: ${face}の目の${PARAM_LABEL[base.op] || '数値'} ${base[key]} → ${tuneValue(key, localTune[k])}`);
  }
  const out = document.getElementById('dbgOut');
  out.value = lines.length ? `${lines.join('\n')}\n\n${JSON.stringify(localTune)}` : '変更はありません';
  out.hidden = false; out.select();
  navigator.clipboard?.writeText(out.value).then(() => toast('クリップボードにコピーしました'), () => {});
}
{
  dbgEl.addEventListener('click', e => {
    if (e.target === dbgEl) { dbgOpen = false; renderDbg(); render(); return; }
    const act = e.target.closest('[data-dbg]')?.dataset.dbg;
    if (act === 'close') { dbgOpen = false; renderDbg(); render(); }
    else if (act === 'reset') { localTune = {}; lsSet(TUNE_KEY, null); renderDbg(); }
    else if (act === 'export') dbgExport();
  });
  dbgEl.addEventListener('change', e => {
    const k = e.target.dataset.k; if (!k) return;
    const [id, face, i, key] = k.split('~');
    const rk = id === 'rule' ? face : key;
    const was = id === 'rule' ? RULE_BASE[face] : JSON.parse(BASE_F[id])[face][i][key], v = tuneValue(rk, e.target.value);
    if (v == null || v === was) delete localTune[k]; else localTune[k] = v;
    lsSet(TUNE_KEY, Object.keys(localTune).length ? JSON.stringify(localTune) : null);
    const y = dbgEl.scrollTop;
    renderDbg(); dbgEl.scrollTop = y;
  });
}

// ---------------- 操作 ----------------
$app.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  if (act === 'tune') { dbgOpen = true; renderDbg(); }
  else if (act === 'create') createRoom();
  else if (act === 'join') joinRoom(document.getElementById('codeInput').value.trim());
  else if (act === 'leave') leaveRoom();
  else if (act === 'start') startGame();
  else if (act === 'bid') submitBid();
  else if (act === 'chip') {
    const max = maxBidFor(S.V.points[me()]);
    const cur = Number(S.bidDraft) || 0, q = t.dataset.v;
    if (q === 'max') { S.bidDraft = String(max); S.err = ''; render(); return; }
    const d = Number(q);
    if (cur + d > max) { S.err = 'それ以上は入札できません'; render(); return; }
    flyChip(t, d);
    play('chip', { rate: 0.92 + Math.random() * 0.16 });
    S.bidDraft = String(cur + d); S.err = ''; render();
  }
  else if (act === 'chipreset') { S.bidDraft = ''; S.err = ''; render(); }
  else if (act === 'roll') pressRoll();
  else if (act === 'rematch') pressRematch();
});
$app.addEventListener('input', e => {
  if (e.target.id === 'nameInput') lsSet(NAME_KEY, e.target.value.slice(0, 12));
  if (e.target.id === 'bidInput') {
    S.bidDraft = e.target.value.replace(/[^\d]/g, '');
    const max = maxBidFor(S.V.points[me()]);
    S.err = S.bidDraft !== '' && Number(S.bidDraft) > max ? 'それ以上は入札できません' : '';
    render();
  }
});
$app.addEventListener('change', e => {
  if (e.target.id === 'modeSel' && S.role === 'host') set(ref(db, `${pathRoom()}/mode`), e.target.value).catch(err => console.warn(err));
  if (e.target.id === 'autoRoll') { S.autoRoll = e.target.checked; scheduleAutoRoll(); }
});
$app.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'bidInput') submitBid();
  if (e.target.id === 'codeInput') joinRoom(e.target.value.trim());
});

document.getElementById('muteBtn').addEventListener('click', () => {
  SE.muted = !SE.muted; lsSet(MUTE_KEY, SE.muted ? '1' : null); renderMute();
  if (!SE.muted) { seUnlock(); setTimeout(() => play('chip'), 60); }
});
renderMute();
render();
boot();
</script>
