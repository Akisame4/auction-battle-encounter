    const side = r => {
      const win = c.winner === r;
      return `<div class="side ${win ? 'win' : 'lose'} ${first ? (win ? 'anim-pay' : 'anim-back') : 'paid'}">
        <div class="who ${cls(r)}">${who(r)}</div>${pileHtml(lastBid[r], 140, 96, 44)}<div class="amt ${cls(r)}">${lastBid[r]}</div>
        ${win ? `<div class="stamp">落札${c.random ? '(ランダム)' : ''}</div>` : '<div class="muted" style="font-size:11px;margin-top:4px">チップは戻ります</div>'}</div>`;
    };
    const again = c.bids.length > 1 ? `<div class="note" style="margin:0 0 8px">最初のベット: あなた ${c.bids[0][me()]} / 相手 ${c.bids[0][op()]}(同額)</div>` : '';
    const a = ABIL[c.item];
    let instr;
    if (!mineWin) instr = `<div class="note"><span class="wait" style="color:inherit">相手が書き込み先を選んでいます<span class="dots"></span></span></div>`;
    else {
      const sel = S.pickSel;
      instr = `<div class="banner" style="margin-top:12px">${c.price}枚を支払いました。下のダイスの<b>空いている面</b>を選んでください(自分にも相手にも書けます)
          ${a.face ? `<br><b style="color:var(--gold-hi)">面指定</b>: ${a.face}の面で本領発揮、ほかの面だと「${esc(fxText(a.fxOther))}」` : ''}</div>
        <div class="row" style="justify-content:center"><button class="btn" data-act="pick" ${sel ? '' : 'disabled'}>${sel ? `${sel.side === 'self' ? 'あなた' : '相手'}のダイスの${sel.face}の面に書く` : '面を選んでください'}</button>
        ${sel ? `<span class="muted" style="font-size:13px">→ ${esc(faceDesc(a, sel.face))}</span>` : ''}</div>`;
    }
    return head(`LOT ${String(V.round).padStart(2, '0')} ・ 開票`, esc(a.name)) + again
      + `<div class="reveal">${side(me())}${lotCard(c.item, `LOT ${String(V.round).padStart(2, '0')}`)}${side(op())}</div>${instr}`;
  }
  if (ph === 'battle' || ph === 'result') return viewBattle();
  return '';
}
function viewDice() {
  const V = S.V;
  const picking = V.phase === 'pick' && V.need.by === me();
  const die = r => {
    const side = r === me() ? 'self' : 'opp';
    const cells = V.dice[r].map((id, i) => {
      const f = i + 1;
      const sel = S.pickSel && S.pickSel.side === side && S.pickSel.face === f;
      const hl = PB.hl && PB.hl.role === r && PB.hl.face === f && V.battle;
      if (!id) {
        if (picking) {
          const a = ABIL[V.cur.item];
          return `<div class="face empty can ${sel ? 'picked' : ''}" data-act="sel" data-side="${side}" data-face="${f}"><span class="num">${f}</span>
            ${sel ? `<div class="fn">${esc(a.name)}</div><div class="fe">${esc(faceDesc(a, f))}</div>` : `空き${a.face === f ? ' <span class="honryo">★本領</span>' : ''}`}</div>`;
        }
        return `<div class="face empty"><span class="num">${f}</span>空き</div>`;
      }
      const a = ABIL[id], known = abilKnown(id);
      const isNew = V.history.length && V.history[V.history.length - 1].item === id && V.phase !== 'battle' && V.phase !== 'result';
      return `<div class="face f ${isNew ? 'flash' : ''} ${hl ? 'hit' : ''}" title="${esc(known ? abilDesc(a) : '効果は伏せられています')}"><span class="stripe bg-${catOf(id)}"></span><span class="num">${f}</span>
        <div class="fn">${esc(a.name)}</div><div class="fe">${known ? esc(faceDesc(a, f)) : '？？？'}</div>
        ${known && a.face === f ? '<div class="honryo">★本領</div>' : ''}</div>`;
    }).join('');
    return `<div class="die ${cls(r)}"><h4>${who(r)}のダイス</h4><div class="faces">${cells}</div></div>`;
  };
  return `<div class="dicep">${die(me())}${die(op())}</div>`;
}
const CUBE_ROT = { 1: [0, 0], 2: [0, -90], 3: [-90, 0], 4: [90, 0], 5: [0, 90], 6: [0, 180] };
function viewBattle() {
  const V = S.V, B = V.battle;
  const shownAll = PB.shown >= B.turns.length && !PB.busy;
  const role = PB.cube?.role || B.first;
  const faces = [1, 2, 3, 4, 5, 6].map(f => {
    const id = V.dice[role][f - 1];
    return `<div class="cf cf${f}"><div class="cn">${f}</div><div class="ct">${esc(ABIL[id].name)}</div></div>`;
  }).join('');
  let top;
  if (V.phase === 'result' && shownAll) {
    const w = B.result.winner;
    const t = w == null ? ['DRAW', '引き分け', 'draw'] : w === me() ? ['WIN', 'あなたの勝ち', 'win'] : ['LOSE', 'あなたの負け', 'lose'];
    const rm = S.pub?.rematch?.go || {};
    top = `<div class="result ${t[2]}">${t[0]}<small>${t[1]}</small></div><div class="center turnline">${fillNames(B.result.reason)}</div>
      <div class="row" style="justify-content:center;margin-top:12px">
        ${rm[me()] ? `<div class="wait" style="color:inherit">${rm[op()] ? '再戦を準備しています' : '相手の返事を待っています'}<span class="dots"></span></div>` : `<button class="btn" data-act="rematch">もう一度遊ぶ</button>`}
        ${S.role === 'host' ? modeSelect() : ''}
      </div>${rm[op()] && !rm[me()] ? '<div class="note">相手は再戦を希望しています</div>' : ''}`;
  } else {
    const nextT = PB.busy ? B.turns[PB.shown] : B.turns[V.rolled];
    const myTurn = V.phase === 'battle' && V.need.by === me() && !PB.busy && PB.shown >= V.rolled;
    const turnInfo = nextT ? `ターン <b>${nextT.round}</b> / ${TURN_LIMIT} ・ <b class="${cls(nextT.role)}">${who(nextT.role)}</b>の番` : '';
    const firstInfo = `先攻: <b class="${cls(B.first)}">${who(B.first)}</b>${B.tied ? '(チップが同じなのでランダム)' : '(チップが少ない方)'}`;
    top = `<div class="turnline">${firstInfo}</div><div class="turnline">${turnInfo}</div>
      <div class="row" style="margin-top:14px;min-height:50px">
        ${myTurn ? `<button class="btn" data-act="roll" style="font-size:18px;padding:13px 30px">ダイスを振る</button>`
               : `<div class="wait" style="color:inherit">${PB.busy ? 'ダイスが転がっています' : '相手が振るのを待っています'}<span class="dots"></span></div>`}</div>
      <label class="toggle" style="margin-top:10px"><input type="checkbox" id="autoRoll" ${S.autoRoll ? 'checked' : ''}> 自分の番は自動で振る</label>`;
  }
  return `<div class="tbl-head"><span>BATTLE</span><span>${shownAll && V.phase === 'result' ? 'GAME OVER' : ''}</span></div>
    <div class="arena"><div class="scene"><div class="cube ${cls(role)}" id="cube" style="--rollms:${ROLL_ANIM_MS}ms">${faces}</div></div><div>${top}</div></div>`;
}
// 2人の状態(毒・死の宣告は重なった分を1つずつ並べる)
function statusRows(s) {
  if (!s) return [];
  const rows = [];
  if (s.guard) rows.push(['🛡', `防御 <b>${s.guard}回</b>防ぐ`, s.guardTurns > 1 ? `相手の番 あと${s.guardTurns}回のあいだ` : '相手の次の番だけ']);
  if (s.power) rows.push(['🔥', `気合 この番の攻撃 <b>×${s.power}</b>`, '番が終わると消える']);
  if (s.charge) rows.push(['🔥', `気合溜め 次の番の攻撃 <b>×${s.charge}</b>`, '自分の次の番に効く']);
  (s.poisons || []).forEach((p, i, a) => rows.push(['☠', `毒${a.length > 1 ? (i + 1) : ''} 番のはじめに <b>${p.n}ダメ</b>`, `あと${p.left}回(防御で防げない)`]));
  (s.dooms || []).forEach((d, i, a) => rows.push(['💀', `死の宣告${a.length > 1 ? (i + 1) : ''} <b>${d.n}ダメ</b>`, d.left === 1 ? '次の番のはじめに発動!' : `あと${d.left}番のはじめに発動`]));
  if (s.nullify) rows.push(['🚫', `次の出目が無効${s.nullify > 1 ? ` <b>×${s.nullify}</b>` : ''}`, s.nullify > 1 ? `次の${s.nullify}回が何も起きない` : '次に振った目は何も起きない']);
  return rows;
}
const lastStatus = {};
function viewStatus(r) {
  const rows = statusRows(PB.snap?.[r]);
  const prev = lastStatus[r] || [];
  const html = rows.length ? rows.map(([ic, t, sub]) => `<div class="st ${prev.includes(t + sub) ? '' : 'new'}"><span class="ic">${ic}</span><span>${t}<small>${sub}</small></span></div>`).join('')
    : '<div class="none">なし</div>';
  lastStatus[r] = rows.map(x => x[1] + x[2]);
  return `<div class="status"><h5>状態</h5>${html}</div>`;
}
function viewLog() {
  if (!PB.log.length) return '<p class="muted">まだ誰も振っていません</p>';
  return `<div class="log">${PB.log.map(({ role, round, st }) => {
    const head = st.kind === 'tick' ? `ターン${round} ${who(role)}の番のはじめ` : `ターン${round} ${who(role)}: ${st.face}の目「${esc(ABIL[st.id].name)}」${st.invalid ? '(無効)' : ''}`;
    return `<div class="le ${cls(role)}"><div class="h">${head}</div>${st.lines.map(fillNames).join('<br>')}</div>`;
  }).join('')}</div>`;
}
// キューブは描き直しのたびに作り直されるので、回転は描画後にかける
let cubeSpin = 0, lastCubeAnim = null;
function afterGameRender() {
  const el = document.getElementById('cube');
  if (!el || !PB.cube) return;
  const [x, y] = CUBE_ROT[PB.cube.face];
  const animId = PB.cube.spin ? `${PB.shown}:${PB.log.length}` : null;
  if (animId && animId !== lastCubeAnim) {
    lastCubeAnim = animId;
    cubeSpin++;
    const from = `rotateX(${x + 720 * (cubeSpin) - 360}deg) rotateY(${y + 720 * cubeSpin - 540}deg)`;
    el.style.transition = 'none'; el.style.transform = from;
    el.getBoundingClientRect();
    el.style.transition = '';
  }
  el.style.transform = `rotateX(${x + 720 * cubeSpin}deg) rotateY(${y + 720 * cubeSpin}deg)`;
}
// チップがトレイから卓の中央へ飛んでいく演出(画面の描き直しに巻き込まれないよう body 直下に置く)
function flyChip(fromEl, d) {
  const to = document.getElementById('pot');
  if (!fromEl || !to) return;
  const a = fromEl.getBoundingClientRect(), b = to.getBoundingClientRect();
  const el = document.createElement('span');
  el.className = `chip k${d} flychip`;
  el.innerHTML = `<span>${d}</span>`;
  el.style.left = a.left + 'px'; el.style.top = a.top + 'px';
  document.body.appendChild(el);
  el.getBoundingClientRect();
  el.style.transform = `translate(${b.left + b.width / 2 - a.left - 29}px,${b.top + b.height / 2 - a.top - 29}px) scale(.85)`;
  setTimeout(() => { el.style.opacity = '0'; }, 380);
  setTimeout(() => el.remove(), 800);
}

let toastTimer;
function toast(msg) {
  let el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 2500);
}

// ---------------- [TEST] デバッグ: 能力一覧と数値調整 ----------------
const PARAM_LABEL = { turns: '相手の番の数', hits: '回数', ticks: 'ターン数', p: '表の確率', heal: '回復', hi: '半分以下', lo: 'それ以外', delay: '何ターン後' };
const N_LABEL = { dmg: 'ダメージ', heal: '回復', poison: '毎ターン', gamble: 'ダメージ', both: 'ダメージ', drain: 'ダメージ', guard: '防ぐ回数', charge: '倍率', selfdmg: 'ダメージ', rampage: '自分へ', doom: 'ダメージ' };
const paramLabel = (op, key) => key === 'n' ? (N_LABEL[op] || '数値') : PARAM_LABEL[key];
const dbgEl = document.getElementById('dbg');
let dbgOpen = false;

function dbgDesc(a) {
  const t = tunedFx(a.id, localTune);
  return a.face ? `${a.face}の面: ${fxText(t.fx)} / ほかの面: ${fxText(t.fxOther)}` : fxText(t.fx);
}
function dbgParams(a) {
  const base = JSON.parse(BASE_FX[a.id]), t = tunedFx(a.id, localTune);
  const out = [];
  for (const side of ['fx', 'fxOther']) (t[side] || []).forEach((f, i) => {
    for (const key of TUNE_KEYS) if (key in f) {
      const k = `${a.id}~${side}~${i}~${key}`, was = base[side][i][key], chg = f[key] !== was;
      const sideLabel = a.face ? (side === 'fx' ? `${a.face}の面 ` : 'ほか ') : '';
      out.push(`<label class="prm ${chg ? 'chg' : ''}"><span><span class="fside">${sideLabel}</span>${esc(paramLabel(f.op, key))}</span>
        <input type="number" data-k="${k}" value="${f[key]}" min="0" ${key === 'p' ? 'step="0.05" max="1"' : 'step="1"'}>${chg ? `<span class="was">元${was}</span>` : ''}</label>`);
    }
  });
  return out.join('') || '<span class="muted" style="font-size:11.5px">数値なし</span>';
}
function renderDbg() {
  if (!dbgOpen) { dbgEl.hidden = true; return; }
  const ingame = S.screen === 'game' && S.pub?.start;
  const rows = Object.entries(POOLS).filter(([, pool]) => pool).map(([k, pool]) => `
    <tr><th colspan="3" style="color:var(--gold);font-size:12px;padding-top:12px">プール: ${esc(k)}(${pool.length}個)</th></tr>
    <tr><th>能力</th><th>数値</th><th>いまの効果</th></tr>
    ${pool.map(a => `<tr data-id="${a.id}"><td class="nm">${SUIT[a.cat] || ''} ${esc(a.name)}<small>${esc(a.cat)}${a.face ? ` / ${a.face}の面で本領` : ''}</small></td>
      <td class="pr">${dbgParams(a)}</td><td class="ds">${esc(dbgDesc(a))}</td></tr>`).join('')}`).join('');
  const n = Object.keys(localTune).length;
  dbgEl.innerHTML = `<div class="box">
    <div class="top"><h3>能力一覧(デバッグ)</h3><span class="tag">変更 ${n}件</span><div class="spacer" style="flex:1"></div>
      <button class="ghost" data-dbg="export">変更点を書き出す</button><button class="ghost" data-dbg="reset" ${n ? '' : 'disabled'}>全部元に戻す</button><button class="btn" data-dbg="close" style="padding:8px 18px">閉じる</button></div>
    <div class="note">数値はこのブラウザに保存されます。ゲーム開始(再戦を含む)のとき、ホストの調整値が相手にも配られて、その対戦はその値で進みます。
      ${ingame ? '<br><b style="color:var(--gold-hi)">いまの対戦には反映されません。次のゲームから反映されます。</b>' : ''}
      ${ingame && S.pub.start.tune ? `<br>いまの対戦はホストの調整値(${Object.keys(S.pub.start.tune).length}件)で進んでいます。` : ''}</div>
    <table>${rows}</table>
    <textarea id="dbgOut" readonly hidden></textarea></div>`;
  dbgEl.hidden = false;
}
function dbgExport() {
  const lines = [];
  for (const k in localTune) {
    const [id, side, i, key] = k.split('~'), a = ABIL[id];
    if (!a) continue;
    const base = JSON.parse(BASE_FX[id])[side][i];
    const where = a.face ? (side === 'fx' ? `${a.face}の面の` : 'ほかの面の') : '';
    lines.push(`${a.name}: ${where}${paramLabel(base.op, key)} ${base[key]} → ${tuneValue(key, localTune[k])}`);
  }
  const out = document.getElementById('dbgOut');
  out.value = lines.length ? `${lines.join('\n')}\n\n${JSON.stringify(localTune)}` : '変更はありません';
  out.hidden = false; out.select();
  navigator.clipboard?.writeText(out.value).then(() => toast('クリップボードにコピーしました'), () => {});
}
if (DEBUG) {
  const btn = document.getElementById('dbgBtn');
  btn.hidden = false;
  btn.addEventListener('click', () => { dbgOpen = true; renderDbg(); });
  dbgEl.addEventListener('click', e => {
    if (e.target === dbgEl) { dbgOpen = false; renderDbg(); return; }
    const act = e.target.closest('[data-dbg]')?.dataset.dbg;
    if (act === 'close') { dbgOpen = false; renderDbg(); }
    else if (act === 'reset') { localTune = {}; lsSet(TUNE_KEY, null); renderDbg(); }
    else if (act === 'export') dbgExport();
  });
  dbgEl.addEventListener('change', e => {
    const k = e.target.dataset.k; if (!k) return;
    const [id, side, i, key] = k.split('~');
    const was = JSON.parse(BASE_FX[id])[side][i][key], v = tuneValue(key, e.target.value);
    if (v == null || v === was) delete localTune[k]; else localTune[k] = v;
    lsSet(TUNE_KEY, Object.keys(localTune).length ? JSON.stringify(localTune) : null);
    const y = dbgEl.scrollTop;
    renderDbg(); dbgEl.scrollTop = y;
  });
}

// ---------------- 操作 ----------------
$app.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  if (act === 'create') createRoom();
  else if (act === 'join') joinRoom(document.getElementById('codeInput').value.trim());
  else if (act === 'leave') leaveRoom();
  else if (act === 'start') startGame();
  else if (act === 'bid') submitBid();
  else if (act === 'chip') {
    const max = maxBidFor(S.V.points[me()]);
    const cur = Number(S.bidDraft) || 0, q = t.dataset.v;
    if (q === 'max') { S.bidDraft = String(max); S.err = ''; render(); return; }
    const d = Number(q);
    if (cur + d > max) { S.err = 'それ以上は入札できません'; render(); return; }
    flyChip(t, d);
    play('chip', { rate: 0.92 + Math.random() * 0.16 });
    S.bidDraft = String(cur + d); S.err = ''; render();
  }
  else if (act === 'chipreset') { S.bidDraft = ''; S.err = ''; render(); }
  else if (act === 'sel') { S.pickSel = { side: t.dataset.side, face: Number(t.dataset.face) }; render(); }
  else if (act === 'pick') submitPick();
  else if (act === 'roll') pressRoll();
  else if (act === 'rematch') pressRematch();
});
$app.addEventListener('input', e => {
  if (e.target.id === 'nameInput') lsSet(NAME_KEY, e.target.value.slice(0, 12));
  if (e.target.id === 'bidInput') {
    S.bidDraft = e.target.value.replace(/[^\d]/g, '');
    const max = maxBidFor(S.V.points[me()]);
    S.err = S.bidDraft !== '' && Number(S.bidDraft) > max ? 'それ以上は入札できません' : '';
    render();
  }
});
$app.addEventListener('change', e => {
  if (e.target.id === 'modeSel' && S.role === 'host') set(ref(db, `${pathRoom()}/mode`), e.target.value).catch(err => console.warn(err));
  if (e.target.id === 'autoRoll') { S.autoRoll = e.target.checked; scheduleAutoRoll(); }
});
$app.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'bidInput') submitBid();
  if (e.target.id === 'codeInput') joinRoom(e.target.value.trim());
});

document.getElementById('muteBtn').addEventListener('click', () => {
  SE.muted = !SE.muted; lsSet(MUTE_KEY, SE.muted ? '1' : null); renderMute();
  if (!SE.muted) { seUnlock(); setTimeout(() => play('chip'), 60); }
});
renderMute();
render();
boot();
